name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [darwin, linux, windows]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: 1.21
      - name: Install dependencies
        run: go get .
      - name: Build Binary
        run: GOOS=${{ matrix.platform }} GOARCH=amd64 CGO_ENABLED=0 go build -o cbdinotest-${{ matrix.platform }} -ldflags="-X github.com/couchbaselabs/cbdinotest/contrib/buildversion.MainPkgVersion=${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cbdinotest-${{ matrix.platform }}
          path: cbdinotest-${{ matrix.platform }}

  build-testsvc:
    name: Build Test Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build worker Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./examples/testsvc
          load: true
          tags: testsvc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save worker Docker image
        run: docker save testsvc -o testsvc.tar

      - name: Upload testsvc artifacts
        uses: actions/upload-artifact@v6
        with:
          name: testsvc-artifacts
          path: testsvc.tar
  
  test:
    name: Integration Test
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: cbdinotest-linux
      - run: chmod +x cbdinotest-linux

      - name: Download testsvc artifacts
        uses: actions/download-artifact@v7
        with:
          name: testsvc-artifacts
      - run: docker load -i testsvc.tar

      # dinocluster is currently required to run any test
      - name: Download cbdinocluster
        run: |
          curl -fsSL -o cbdinocluster \
            https://github.com/couchbaselabs/cbdinocluster/releases/download/v0.0.110/cbdinocluster-linux-amd64
          chmod +x cbdinocluster

      - name: Run Test
        run: |
          docker run -d --name worker --network host testsvc
          docker logs -f worker 2>&1 | sed -u 's/^/[WORKER] /' &
          ./cbdinotest-linux run ./examples/situation.js